  <body data-page="contact">
    <header class="site-header">
      <a class="brand" href="index.html" aria-label="Portfolio home"><span class="brand-mark"></span><span>Portfolio</span></a>
      <button class="menu-button" type="button" aria-label="Open menu" aria-expanded="false"><span></span><span></span></button>
    </header>
    <div class="menu-panel" aria-hidden="true">
      <div class="menu-glass">
        <div class="menu-top"><p class="eyebrow" data-i18n="menuLabel">Menu</p><button class="menu-close" type="button" aria-label="Close menu">×</button></div>
        <nav class="menu-links" aria-label="Site navigation">
          <a href="index.html" data-i18n="navHome">主页</a>

        <div class="contact-actions">
          <a class="glass-tile" href="mailto:your.email@example.com"><strong>Email</strong><small>your.email@example.com</small></a>
          <a class="glass-tile" href="#"><strong>GitHub</strong><small>@yourname</small></a>
          <a class="glass-tile" href="#"><strong>LinkedIn</strong><small>Connect</small></a>
        </div>
